# XcodeGen project for the Memories iOS app.
# Regenerate the .xcodeproj after any change: `cd MemoriesIOS && xcodegen generate`
name: MemoriesIOS
options:
  bundleIdPrefix: fr.midiland
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # English is the source language; French comes from the String Catalogs in Resources/.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1000013"
targets:
  MemoriesIOS:
    type: application
    platform: iOS
    # Read by XcodeGen for the scheme's BuildableName (PRODUCT_NAME alone is not).
    productName: Memories
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.midiland.memories
        PRODUCT_NAME: Memories
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 53LB2CD33L
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Memories
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Export compliance: only Apple's built-in cryptography (TLS, CryptoKit, Keychain).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Allows http:// to local names (.local, domainless hostnames)
          # and, later, to the NativeX bridge loopback server.
          NSAllowsLocalNetworking: true
        # Localized in Resources/InfoPlist.xcstrings
        NSLocalNetworkUsageDescription: Memories connects to your Nextcloud server on the local network.
        NSPhotoLibraryUsageDescription: Memories shows the photos of this device in your timeline, next to the ones on your Nextcloud server, and saves the photos you download to your library without duplicates.
  MemoriesIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MemoriesIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.midiland.memories.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's PRODUCT_NAME is "Memories", not the target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Memories.app/Memories
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  MemoriesIOS:
    build:
      targets:
        MemoriesIOS: all
        MemoriesIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MemoriesIOSTests
