# XcodeGen project for the Memories iOS app.
# Regenerate the .xcodeproj after any change: `cd MemoriesIOS && xcodegen generate`
name: MemoriesIOS
options:
  bundleIdPrefix: fr.midiland
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # English is the source language; French comes from the String Catalogs in Resources/.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1000015"
targets:
  MemoriesIOS:
    type: application
    platform: iOS
    # Read by XcodeGen for the scheme's BuildableName (PRODUCT_NAME alone is not).
    productName: Memories
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.midiland.memories
        PRODUCT_NAME: Memories
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 53LB2CD33L
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: Sources/Memories.entitlements
      properties:
        # Shared folder between the app and its widget (widget memories cache).
        com.apple.security.application-groups:
          - group.fr.midiland.memories
    dependencies:
      - target: MemoriesWidget
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Memories
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Export compliance: only Apple's built-in cryptography (TLS, CryptoKit, Keychain).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # `memories-ios://memory?...`: opens a photo from the widget (`MemoryDeepLink`).
        CFBundleURLTypes:
          - CFBundleURLName: fr.midiland.memories
            CFBundleURLSchemes:
              - memories-ios
        # Periodic refresh of the widget's memories (`MemoryRefreshService`).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - fr.midiland.memories.refresh-memories
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Allows http:// to local names (.local, domainless hostnames)
          # and, later, to the NativeX bridge loopback server.
          NSAllowsLocalNetworking: true
        # Localized in Resources/InfoPlist.xcstrings
        NSLocalNetworkUsageDescription: Memories connects to your Nextcloud server on the local network.
        NSPhotoLibraryUsageDescription: Memories shows the photos of this device in your timeline, next to the ones on your Nextcloud server, and saves the photos you download to your library without duplicates.
  # Home screen widget ("On this day"). Reads the memories the app prepares in the App Group
  # folder: it never sees the credentials and does no networking.
  MemoriesWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Sources/OnThisDay/MemoryCache.swift
      - Sources/OnThisDay/MemoryDay.swift
      - Sources/OnThisDay/MemoryDeepLink.swift
      - Sources/OnThisDay/MemoryTimeline.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.midiland.memories.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 53LB2CD33L
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: Widget/MemoriesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fr.midiland.memories
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Memories
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MemoriesIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UITests # UI tests have their own target (MemoriesIOSUITests)
    dependencies:
      - target: MemoriesIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.midiland.memories.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's PRODUCT_NAME is "Memories", not the target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Memories.app/Memories
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
  # Needs a running Nextcloud with Memories and a logged-in app: not part of the default
  # test action, run through the MemoriesIOSUITests scheme.
  MemoriesIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: MemoriesIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.midiland.memories.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  MemoriesIOSUITests:
    build:
      targets:
        MemoriesIOS: all
        MemoriesIOSUITests: [test]
    test:
      config: Debug
      targets:
        - MemoriesIOSUITests
  MemoriesIOS:
    build:
      targets:
        MemoriesIOS: all
        MemoriesIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MemoriesIOSTests
